<style>
  :root {
    --ink: #0e0e0e;
    --paper: #fafaf7;
    --rule: rgba(14,14,14,0.12);
    --quiet: rgba(14,14,14,0.55);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Subtle paper texture via layered gradients — adds warmth without noise */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(14,14,14,0.02), transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(14,14,14,0.025), transparent 60%);
    z-index: 0;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    position: relative;
    z-index: 1;
  }

  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3.5rem;
    max-width: 640px;
    width: 100%;
    opacity: 0;
    animation: rise 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .wordmark {
    width: 100%;
    max-width: 460px;
    height: auto;
    display: block;
    user-select: none;
  }

  .positioning {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.1rem, 2.4vw, 1.4rem);
    color: var(--ink);
    letter-spacing: 0.01em;
    text-align: center;
    margin: 0;
    line-height: 1.4;
  }

  footer {
    padding: 2rem 2rem 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.85rem;
    position: relative;
    z-index: 1;
    opacity: 0;
    animation: rise 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) 0.6s forwards;
  }

  .contacts {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .contacts a {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--quiet);
    text-decoration: none;
    transition: color 0.4s ease;
    position: relative;
    padding-bottom: 2px;
  }

  .contacts a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 1px;
    background: var(--ink);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .contacts a:hover {
    color: var(--ink);
  }

  .contacts a:hover::after {
    transform: scaleX(1);
  }

  @media (max-width: 480px) {
    .stack { gap: 2.5rem; }
    .contacts { gap: 1.25rem; flex-direction: column; align-items: center; }
    main { padding: 3rem 1.5rem; }
    footer { padding: 1.5rem 1.5rem 2rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stack, footer { animation: none; opacity: 1; }
  }
</style>
</head>
